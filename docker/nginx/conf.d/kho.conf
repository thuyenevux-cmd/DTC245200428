# ============================================================================
#  Reverse proxy cho Hệ thống Quản lý Kho hàng
#   :8080  HTTP (chuyển hướng sang HTTPS)
#   :8443  HTTPS (chứng thư tự ký sinh lúc khởi động container)
#   :8081  Cổng nội bộ, KHÔNG publish — chỉ dùng cho Prometheus lấy chỉ số
#          của Docker daemon.
#  Mọi công cụ giám sát đều đi qua nginx và đều yêu cầu đăng nhập.
# ============================================================================

upstream kho_app {
    server app:3000;
    keepalive 16;
}

upstream phpmyadmin {
    server phpmyadmin:80;
    keepalive 8;
}

upstream grafana {
    server grafana:3000;
    keepalive 8;
}

upstream prometheus {
    server prometheus:9090;
    keepalive 8;
}

upstream loki {
    server loki:3100;
    keepalive 8;
}

# WebSocket (Grafana live) cần cơ chế upgrade khi proxy
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;

    # --- Security headers ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header X-XSS-Protection "0" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Chỉ số nginx: exporter đọc từ mạng nội bộ qua cổng HTTP này
    location = /nginx_status {
        stub_status;
        access_log off;
        allow 172.16.0.0/12;
        allow 10.0.0.0/8;
        deny all;
    }

    # Chuyển sang HTTPS
    location / {
        return 301 https://$host:8443$request_uri;
    }
}

server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # --- Security headers ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    # Thu thập chỉ số nginx (chỉ nội bộ, exporter đọc qua mạng riêng)
    location = /nginx_status {
        stub_status;
        access_log off;
        allow 172.16.0.0/12;
        allow 10.0.0.0/8;
        deny all;
    }

    # --- Ứng dụng ---
    location / {
        proxy_pass http://kho_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 60s;
    }

    # --- Công cụ quản lý cơ sở dữ liệu ---
    location /phpmyadmin/ {
        auth_basic "Kho hang - phpMyAdmin";
        auth_basic_user_file /etc/nginx/certs/htpasswd;
        proxy_pass http://phpmyadmin/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Grafana ---
    # serve_from_sub_path=true nên phải giữ nguyên tiền tố /grafana khi chuyển tiếp.
    # Nginx đã xác thực bằng basic auth, nên bỏ header Authorization và chuyển
    # danh tính sang header X-WEBAUTH-USER để Grafana dùng cơ chế auth proxy.
    location /grafana/ {
        auth_basic "Kho hang - Grafana";
        auth_basic_user_file /etc/nginx/certs/htpasswd;
        proxy_pass http://grafana;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization "";
        proxy_set_header X-WEBAUTH-USER $remote_user;
        # WebSocket cho Grafana live
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }

    # --- Prometheus ---
    # Prometheus phục vụ ở thư mục gốc nên bỏ tiền tố /prometheus khi chuyển tiếp
    location /prometheus/ {
        auth_basic "Kho hang - Prometheus";
        auth_basic_user_file /etc/nginx/certs/htpasswd;
        proxy_pass http://prometheus/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Loki (API truy vấn LogQL) ---
    location /loki/ {
        auth_basic "Kho hang - Loki";
        auth_basic_user_file /etc/nginx/certs/htpasswd;
        proxy_pass http://loki;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
