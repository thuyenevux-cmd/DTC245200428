global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: quan-ly-kho-hang
    student: DTC245200428

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  # --- Ứng dụng ---
  - job_name: kho-app
    metrics_path: /metrics
    static_configs:
      - targets: ['app:3000']
        labels:
          service: 'Quan ly kho hang'

  # --- Web server ---
  - job_name: nginx
    static_configs:
      - targets: ['nginx-exporter:9113']
        labels:
          service: 'Nginx reverse proxy'

  # --- Cơ sở dữ liệu ---
  - job_name: mysql
    static_configs:
      - targets: ['mysql-exporter:9104']
        labels:
          service: 'MySQL'

  # --- Máy chủ ---
  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: 'May chu'
