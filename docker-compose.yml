# ============================================================================
#  Hệ thống Quản lý Kho hàng — toàn bộ dịch vụ chạy bằng Docker Compose
#
#  Kiến trúc mạng:
#    kho-net (bridge)      : nginx ↔ app ↔ grafana ↔ prometheus ↔ loki ↔ promtail
#    kho-db  (internal)    : mysql ↔ app ↔ phpmyadmin ↔ mysql-exporter
#    → Mạng kho-db không có NAT ra ngoài, cổng MySQL không được publish.
#    → Chỉ nginx công khai cổng 8080 (HTTP) và 8443 (HTTPS tự ký).
# ============================================================================
name: kho-hang

x-hardening: &hardening
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  # ---------------------------------------------------------------- ứng dụng
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: quan-ly-kho-hang/app:1.0.0
    container_name: kho-app
    restart: unless-stopped
    command: ["sh", "-c", "node scripts/ensure-db.js && exec node src/server.js"]
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOST: 0.0.0.0
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE}
      SESSION_SECRET: ${SESSION_SECRET}
      COOKIE_SECURE: "false"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - kho-net
      - kho-db
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    user: "1000:1000"
    <<: *hardening
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.50"

  # -------------------------------------------------------------- cơ sở dữ liệu
  mysql:
    image: mysql:8.0
    container_name: kho-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-name-resolve
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_EXPORTER_PASSWORD: ${MYSQL_EXPORTER_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - kho-db
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "1.00"

  # ------------------------------------------------------- công cụ quản lý DB
  phpmyadmin:
    image: phpmyadmin:5.2.3-apache
    container_name: kho-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: "3306"
      PMA_USER: ${MYSQL_USER}
      PMA_PASSWORD: ${MYSQL_PASSWORD}
      UPLOAD_LIMIT: "20M"
    volumes:
      - phpmyadmin-data:/var/www/html
      # File sinh từ .env bởi scripts/gen-secrets.sh — KHÔNG commit.
      # Đường dẫn trong image là /etc/phpmyadmin (chữ thường) — Linux phân biệt hoa thường.
      - ./docker/phpmyadmin/config.secret.inc.php:/etc/phpmyadmin/config.secret.inc.php:ro
    networks:
      - kho-net
      - kho-db
    tmpfs:
      - /tmp:size=32m,mode=1777
    <<: *hardening
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.50"

  # ------------------------------------------------------------- reverse proxy
  nginx:
    build:
      context: docker/nginx
    image: quan-ly-kho-hang/nginx:1.0.0
    container_name: kho-nginx
    restart: unless-stopped
    environment:
      SERVER_NAME: ${SERVER_NAME}
      SERVER_IP: ${SERVER_IP:-127.0.0.1}
      MONITORING_USER: ${MONITORING_USER}
      MONITORING_PASSWORD: ${MONITORING_PASSWORD}
    ports:
      - "8080:8080"
      - "8443:8443"
    volumes:
      - nginx-certs:/etc/nginx/certs
    networks:
      - kho-net
    depends_on:
      - app
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32m,uid=101,gid=101,mode=0750
      - /var/run:size=8m,uid=101,gid=101,mode=0750
      - /var/log/nginx:size=32m,uid=101,gid=101,mode=0750
    # Nginx chạy master bằng root để đổi user cho worker; cần đúng 4 capability này.
    # Worker process vẫn chạy bằng user "nginx" (uid 101), không phải root.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.50"

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.5.3
    container_name: kho-nginx-exporter
    restart: unless-stopped
    command:
      - --nginx.scrape-uri=http://nginx:8080/nginx_status
    networks:
      - kho-net
    read_only: true
    tmpfs:
      - /tmp:size=8m
    <<: *hardening
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.25"

  # ------------------------------------------------------------------ metrics
  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: kho-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus-data:/prometheus
    networks:
      - kho-net
    read_only: true
    tmpfs:
      - /tmp:size=16m
    <<: *hardening
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "0.50"

  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: kho-node-exporter
    restart: unless-stopped
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro,rslave
    networks:
      - kho-net
    pid: host
    read_only: true
    tmpfs:
      - /tmp:size=8m
    <<: *hardening
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.25"

  mysql-exporter:
    image: prom/mysqld-exporter:v0.17.2
    container_name: kho-mysql-exporter
    restart: unless-stopped
    command:
      - --config.my-cnf=/etc/mysqld-exporter/my.cnf
      - --collect.info_schema.innodb_metrics
    volumes:
      # File sinh từ .env bởi scripts/gen-secrets.sh — KHÔNG commit
      - ./docker/mysql-exporter/my.cnf:/etc/mysqld-exporter/my.cnf:ro
    networks:
      - kho-net
      - kho-db
    <<: *hardening
    deploy:
      resources:
        limits:
          memory: 96M
          cpus: "0.25"

  # --------------------------------------------------------------------- log
  loki:
    image: grafana/loki:3.6.18
    container_name: kho-loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki-config.yml"]
    volumes:
      - ./docker/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    networks:
      - kho-net
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=16m
    <<: *hardening
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "0.50"

  promtail:
    image: grafana/promtail:3.6.11
    container_name: kho-promtail
    restart: unless-stopped
    command: ["-config.file=/etc/promtail/promtail-config.yml"]
    environment:
      HOSTNAME: kho-promtail
    volumes:
      - ./docker/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - kho-net
    read_only: true
    tmpfs:
      - /tmp:size=16m
    <<: *hardening
    deploy:
      resources:
        limits:
          memory: 96M
          cpus: "0.25"

  # ------------------------------------------------------------------ grafana
  grafana:
    image: grafana/grafana:13.2.3
    container_name: kho-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_BASIC_ENABLED: "true"
      # Nginx xác thực basic auth rồi chuyển danh tính qua header X-WEBAUTH-USER
      GF_AUTH_PROXY_ENABLED: "true"
      GF_AUTH_PROXY_HEADER_NAME: "X-WEBAUTH-USER"
      GF_AUTH_PROXY_HEADER_PROPERTY: "username"
      GF_AUTH_PROXY_AUTO_SIGN_IN: "true"
      GF_SERVER_ROOT_URL: https://${SERVER_IP:-127.0.0.1}:8443/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SECURITY_COOKIE_SECURE: "false"
      GF_INSTALL_PLUGINS: ""
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks:
      - kho-net
    depends_on:
      - prometheus
    <<: *hardening
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "0.50"

networks:
  kho-net:
    name: kho-net
    driver: bridge
  kho-db:
    name: kho-db
    driver: bridge
    internal: true

volumes:
  mysql-data:
    name: kho-mysql-data
  phpmyadmin-data:
    name: kho-phpmyadmin-data
  nginx-certs:
    name: kho-nginx-certs
  prometheus-data:
    name: kho-prometheus-data
  grafana-data:
    name: kho-grafana-data
  loki-data:
    name: kho-loki-data
